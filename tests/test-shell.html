<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CE RMS page test shell</title><style>body{margin:0;font:14px 'Segoe UI',sans-serif;background:#f5f7fc}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff}button,input,select{font:inherit;padding:6px}#status{padding:8px 12px;font-size:12px}iframe{border:0;width:100%;height:calc(100vh - 120px)}iframe[hidden]{display:none}</style><header><b>CE RMS test shell</b><label>Page <select id="page"><option value="overview">Executive Dashboard</option><option value="health">Data Health</option><option value="bms">Battery BMS Monitoring</option></select></label><label>Mode <select id="mode"><option value="fixture">Local fixture</option><option value="live">Authenticated live</option></select></label><label>Fixture <input id="fixture" type="file" accept=".json,.txt"></label><label>Start <input type="date" id="start" value="2026-10-01"></label><label>End inclusive <input type="date" id="end" value="2026-10-26"></label><label>Site <select id="site"><option>ALL</option><option>ABJ-1</option><option>ABJ-2</option><option>LAG-1</option><option>LAG-2</option></select></label><button id="render">Render</button><button id="login">Open dashboard login</button></header><div id="status">Choose a supplied fixture for offline testing. Business fixtures are not bundled in the public project.</div><div id="report"></div><script type="module" src="test-shell.js"></script></html>
